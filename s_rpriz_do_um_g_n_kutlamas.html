<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sana Bir Sürprizim Var! 🎂</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Tone.js for Birthday Melody & Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        :root {
            --bg-dark: #0a0a0c;
            --gold: #facc15;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 40%, #1e1b4b 0%, #0a0a0c 75%);
            color: #ffffff;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        .font-celebrate {
            font-family: 'Fredoka', sans-serif;
        }

        /* Arka plan parıltı efekti */
        .ambient-glow {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(250, 204, 21, 0.16) 0%, rgba(236, 72, 153, 0.08) 50%, transparent 72%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            transition: all 0.9s ease;
        }

        .stage-active .ambient-glow {
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, rgba(250, 204, 21, 0.3) 0%, rgba(236, 72, 153, 0.18) 55%, transparent 75%);
        }

        /* Mobil Odaklı Pasta Konteyneri */
        #cake-wrapper {
            position: relative;
            width: 240px;
            height: 220px;
            cursor: pointer;
            transition: transform 0.85s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20;
            touch-action: manipulation;
        }

        /* Başlangıçta hafif süzülme */
        .cake-idle {
            animation: floatCake 3s ease-in-out infinite;
        }

        @keyframes floatCake {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); }
        }

        /* 1. AŞAMA: Pasta Yaklaşsın (Mobil ekrana taşmadan) */
        .cake-zoomed {
            transform: scale(1.14) translateY(25px) !important;
        }

        /* 2. AŞAMA: Pasta Açılınca Aşağıda Konumlansın ki Fotoğraf ve Yazıyı Kapatmasın */
        .cake-opened {
            transform: scale(1.05) translateY(85px) !important;
        }

        /* Pasta Katmanları Geçişleri */
        #cake-top-group {
            transition: transform 0.85s cubic-bezier(0.68, -0.55, 0.26, 1.55), opacity 0.5s ease;
            transform-origin: center bottom;
            z-index: 30;
        }

        #cake-bottom-group {
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 25;
        }

        .cake-opened #cake-top-group {
            transform: translateY(-130px) rotate(-12deg) scale(0.75);
            opacity: 0;
            pointer-events: none;
        }

        .cake-opened #cake-bottom-group {
            transform: translateY(10px) scale(0.96);
        }

        /* Mum Alevi Animasyonu */
        .flame {
            width: 12px;
            height: 20px;
            background: radial-gradient(ellipse at bottom, #ffffff 15%, #fde047 50%, #f97316 85%, transparent 100%);
            border-radius: 50% 50% 35% 35%;
            box-shadow: 0 0 14px #f59e0b, 0 0 28px #facc15;
            animation: flicker 0.14s ease-in-out infinite alternate;
            transform-origin: center bottom;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-3deg); opacity: 0.92; }
            100% { transform: scale(1.12, 0.94) rotate(3deg); opacity: 1; }
        }

        /* 3. AŞAMA: İçinden Fotoğraf Çıksın (Tam Ekranın Ortasında) */
        #photo-surprise {
            position: absolute;
            left: 50%;
            bottom: 70px;
            transform: translateX(-50%) translateY(30px) scale(0.1) rotate(-6deg);
            opacity: 0;
            transition: all 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 35;
            pointer-events: none;
        }

        .cake-opened #photo-surprise {
            transform: translateX(-50%) translateY(-64px) scale(1) rotate(0deg);
            opacity: 1;
            pointer-events: auto;
            z-index: 40;
        }

        /* Fotoğraf Çerçevesi Parıltısı (Yuvarlak & Altın Parıltılı) */
        .photo-frame {
            position: relative;
            padding: 5px;
            border-radius: 9999px;
            background: linear-gradient(135deg, #facc15, #ec4899, #8b5cf6, #facc15);
            background-size: 300% 300%;
            animation: gradientBorder 4s ease infinite;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85), 0 0 32px rgba(250, 204, 21, 0.75);
        }

        @keyframes gradientBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 4. AŞAMA: Üstteki Net Görünür Kutlama Kartı */
        #celebration-banner {
            opacity: 0;
            transform: translateY(-25px) scale(0.92);
            transition: all 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        #celebration-banner.show-banner {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        /* Altın Sarısı Parlak Başlık (Her ekranda %100 okunaklı) */
        .birthday-title {
            color: #fde047;
            text-shadow: 0 2px 10px rgba(250, 204, 21, 0.45), 0 2px 4px rgba(0, 0, 0, 0.9);
        }

        /* Krema Damlaları */
        .icing-drip {
            background: #fdf2f8;
            border-radius: 0 0 9999px 9999px;
            box-shadow: inset 0 -2px 4px rgba(244, 114, 182, 0.35);
        }
    </style>
</head>

    <script>
        // Durum Değişkenleri
        let isOpened = false;
        let isMuted = false;
        let uploadedPhotoDataUrl = null;
        let synth = null;

        // Sürprizi Başlatan Ana Fonksiyon
        async function triggerBirthdaySurprise() {
            if (isOpened) return;
            isOpened = true;

            const cakeWrapper = document.getElementById('cake-wrapper');
            const clickPrompt = document.getElementById('click-prompt');
            const celebrationBanner = document.getElementById('celebration-banner');
            const bottomActionBar = document.getElementById('bottom-action-bar');
            const replayBtn = document.getElementById('replay-btn');

            // Yönergeyi gizle ve sahne ışığını büyüt
            clickPrompt.style.opacity = '0';
            clickPrompt.style.transform = 'translateY(-10px)';
            setTimeout(() => clickPrompt.classList.add('hidden'), 300);
            document.body.classList.add('stage-active');

            // 1. AŞAMA: Pasta Yaklaşsın
            cakeWrapper.classList.remove('cake-idle');
            cakeWrapper.classList.add('cake-zoomed');

            // Yaklaşma ses efekti
            playZoomSound();

            // 2. AŞAMA: Pasta Açılsın ve İçinden Fotoğraf Çıksın (650ms sonra)
            setTimeout(() => {
                cakeWrapper.classList.remove('cake-zoomed');
                cakeWrapper.classList.add('cake-opened');

                // Konfeti Patlaması
                launchGrandConfetti();

                // "İyi ki Doğdun" Melodisi Çal
                playHappyBirthdayMelody();
            }, 650);

            // 3. AŞAMA: Üstteki Net "İyi Ki Doğdun" Kartı ve Alt Buton Belirsin (950ms sonra)
            setTimeout(() => {
                celebrationBanner.classList.add('show-banner');
                bottomActionBar.classList.remove('opacity-0', 'pointer-events-none');
                bottomActionBar.classList.add('opacity-100', 'pointer-events-auto');
                replayBtn.classList.remove('hidden');
                replayBtn.classList.add('flex');
            }, 950);
        }

        // Sürprizi Başa Sar (Tekrar Oynat)
        function resetSurprise() {
            isOpened = false;

            const cakeWrapper = document.getElementById('cake-wrapper');
            const clickPrompt = document.getElementById('click-prompt');
            const celebrationBanner = document.getElementById('celebration-banner');
            const bottomActionBar = document.getElementById('bottom-action-bar');
            const replayBtn = document.getElementById('replay-btn');

            celebrationBanner.classList.remove('show-banner');
            bottomActionBar.classList.add('opacity-0', 'pointer-events-none');
            bottomActionBar.classList.remove('opacity-100', 'pointer-events-auto');
            cakeWrapper.classList.remove('cake-opened', 'cake-zoomed');
            document.body.classList.remove('stage-active');

            replayBtn.classList.add('hidden');
            replayBtn.classList.remove('flex');

            setTimeout(() => {
                clickPrompt.classList.remove('hidden');
                setTimeout(() => {
                    clickPrompt.style.opacity = '1';
                    clickPrompt.style.transform = 'translateY(0)';
                }, 50);
                cakeWrapper.classList.add('cake-idle');
            }, 350);
        }

        // Büyük Konfeti Patlaması
        function launchGrandConfetti() {
            // Merkez patlama
            confetti({
                particleCount: 110,
                spread: 80,
                origin: { y: 0.55 },
                colors: ['#fbbf24', '#ec4899', '#38bdf8', '#a855f7', '#4ade80']
            });

            // Sağ ve sol konfeti topları
            const duration = 2600;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0, y: 0.65 },
                    colors: ['#fbbf24', '#f472b6', '#60a5fa']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1, y: 0.65 },
                    colors: ['#fbbf24', '#c084fc', '#34d399']
                });

                if (Date.now() < end && isOpened) {
                    requestAnimationFrame(frame);
                }
            })();
        }

        // Butonla Ekstra Konfeti Patlatma
        function fireExtraConfetti() {
            confetti({
                particleCount: 90,
                spread: 100,
                origin: { y: 0.6 }
            });
        }

        // Tone.js ile Pasta Yaklaşma Ses Efekti
        async function playZoomSound() {
            if (isMuted) return;
            try {
                await Tone.start();
                const whooshSynth = new Tone.Synth({
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.2, decay: 0.3, sustain: 0.1, release: 0.3 }
                }).toDestination();
                whooshSynth.volume.value = -10;
                whooshSynth.triggerAttackRelease("C4", "8n");
                setTimeout(() => whooshSynth.triggerAttackRelease("G4", "8n"), 200);
            } catch (e) {
                // Tarayıcı ses izni engellerse sessiz devam et
            }
        }

        // Tone.js ile Neşeli "İyi Ki Doğdun" Melodisi
        async function playHappyBirthdayMelody() {
            if (isMuted) return;
            try {
                await Tone.start();
                if (!synth) {
                    synth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.03, decay: 0.15, sustain: 0.2, release: 0.6 }
                    }).toDestination();
                    synth.volume.value = -6;
                }

                const now = Tone.now();
                const melody = [
                    { note: "C4", duration: "8n", time: 0.0 },
                    { note: "C4", duration: "8n", time: 0.25 },
                    { note: "D4", duration: "4n", time: 0.5 },
                    { note: "C4", duration: "4n", time: 1.0 },
                    { note: "F4", duration: "4n", time: 1.5 },
                    { note: "E4", duration: "2n", time: 2.0 },

                    { note: "C4", duration: "8n", time: 2.8 },
                    { note: "C4", duration: "8n", time: 3.05 },
                    { note: "D4", duration: "4n", time: 3.3 },
                    { note: "C4", duration: "4n", time: 3.8 },
                    { note: "G4", duration: "4n", time: 4.3 },
                    { note: "F4", duration: "2n", time: 4.8 }
                ];

                melody.forEach(item => {
                    synth.triggerAttackRelease(item.note, item.duration, now + item.time);
                });
            } catch (e) {
                // Ses hatası olursa yoksay
            }
        }

        // Sesi Aç / Kapat
        function toggleMute() {
            isMuted = !isMuted;
            const icon = document.getElementById('sound-icon');
            if (isMuted) {
                icon.className = 'fa-solid fa-volume-xmark text-rose-400';
            } else {
                icon.className = 'fa-solid fa-volume-high text-amber-300';
            }
        }

        // Özelleştirme Modalını Aç / Kapat
        function openCustomizeModal() {
            const modal = document.getElementById('customize-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeCustomizeModal() {
            const modal = document.getElementById('customize-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // Cihazdan Fotoğraf Seçildiğinde Okuma
        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedPhotoDataUrl = e.target.result;
                document.getElementById('file-label-text').textContent = "Seçildi: " + file.name;
            };
            reader.readAsDataURL(file);
        }

        // Özelleştirmeleri Kaydet ve Sahneyi Sıfırlayarak Test Et
        function saveCustomization() {
            const nameInput = document.getElementById('input-name').value.trim();
            const urlInput = document.getElementById('input-photo-url').value.trim();
            const messageInput = document.getElementById('input-message').value.trim();

            if (nameInput) {
                document.getElementById('display-name').textContent = nameInput.toLocaleUpperCase('tr-TR');
            }

            if (uploadedPhotoDataUrl) {
                document.getElementById('friend-photo').src = uploadedPhotoDataUrl;
            } else if (urlInput) {
                document.getElementById('friend-photo').src = urlInput;
            }

            if (messageInput) {
                document.getElementById('display-message').textContent = messageInput;
            }

            closeCustomizeModal();
            resetSurprise();
        }
    </script>
</body>
</html>
