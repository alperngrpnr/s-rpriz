<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geçmiş Olsun Sevgilim ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #2e1a2f 0%, #120b18 100%);
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      position: relative;
    }

    /* Arka plan kalpleri */
    .bg-heart {
      position: absolute;
      color: rgba(255, 105, 180, 0.25);
      animation: floatUp linear infinite;
      z-index: 1;
      user-select: none;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.6) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    /* Mesaj Kartı */
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 24px 32px;
      text-align: center;
      max-width: 420px;
      margin: 0 16px 20px 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      z-index: 10;
      animation: fadeInDown 1.2s ease-out;
    }

    .card h1 {
      font-size: 1.8rem;
      color: #ff758c;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .card p {
      font-size: 1rem;
      line-height: 1.6;
      color: #fce4ec;
      font-weight: 300;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Buket Alanı */
    .bouquet-container {
      position: relative;
      width: 320px;
      height: 380px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 5;
      animation: scaleIn 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Vazo / Buket Sarmal Kağıdı */
    .wrapper {
      position: absolute;
      bottom: 20px;
      width: 140px;
      height: 170px;
      background: linear-gradient(135deg, #d7ccc8 0%, #a1887f 100%);
      clip-path: polygon(15% 0%, 85% 0%, 65% 100%, 35% 100%);
      box-shadow: inset 0 -10px 20px rgba(0, 0, 0, 0.3);
      z-index: 4;
    }

    .ribbon {
      position: absolute;
      bottom: 105px;
      width: 70px;
      height: 14px;
      background: #ff4081;
      border-radius: 7px;
      z-index: 5;
      box-shadow: 0 4px 10px rgba(255, 64, 129, 0.5);
    }

    .ribbon::after {
      content: '❤';
      position: absolute;
      top: -9px;
      left: 27px;
      font-size: 20px;
      color: #ff1744;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    /* Saplar */
    .stem {
      position: absolute;
      bottom: 80px;
      width: 6px;
      height: 180px;
      background: linear-gradient(to top, #2e7d32, #4caf50);
      border-radius: 4px;
      transform-origin: bottom center;
    }

    .stem-1 { transform: rotate(-24deg); height: 210px; }
    .stem-2 { transform: rotate(-12deg); height: 235px; }
    .stem-3 { transform: rotate(0deg);   height: 250px; }
    .stem-4 { transform: rotate(12deg);  height: 235px; }
    .stem-5 { transform: rotate(24deg);  height: 210px; }

    /* Çiçek Başları */
    .flower {
      position: absolute;
      width: 70px;
      height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: gentleSway 4s ease-in-out infinite alternate;
    }

    .flower-1 { top: 75px;  left: 25px;  animation-delay: 0.2s; }
    .flower-2 { top: 40px;  left: 65px;  animation-delay: 0.5s; }
    .flower-3 { top: 15px;  left: 125px; animation-delay: 0s; }
    .flower-4 { top: 40px;  left: 185px; animation-delay: 0.7s; }
    .flower-5 { top: 75px;  left: 225px; animation-delay: 0.4s; }

    @keyframes gentleSway {
      from { transform: rotate(-3deg); }
      to { transform: rotate(3deg); }
    }

    /* Yapraklar */
    .petal {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50% 50% 0 50%;
      transform-origin: bottom right;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    /* Renk Paleti */
    .flower-1 .petal, .flower-5 .petal {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
    }
    .flower-2 .petal, .flower-4 .petal {
      background: linear-gradient(135deg, #ff4b72 0%, #f80759 100%);
    }
    .flower-3 .petal {
      background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
    }

    .petal:nth-child(1) { transform: rotate(0deg); }
    .petal:nth-child(2) { transform: rotate(72deg); }
    .petal:nth-child(3) { transform: rotate(144deg); }
    .petal:nth-child(4) { transform: rotate(216deg); }
    .petal:nth-child(5) { transform: rotate(288deg); }

    /* Çiçek Göbeği */
    .center {
      position: absolute;
      width: 22px;
      height: 22px;
      background: radial-gradient(circle, #fff176 30%, #fbc02d 100%);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255, 235, 59, 0.8);
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Geçmiş Olsun Aşkım ❤️</h1>
    <p>
      Hemen iyileşip aramıza dönmeni bekliyorum.<br />
      Senin için solmayacak bir buket hazırladım. Çok güçlüsün, her zaman yanındayım!
    </p>
  </div>

  <div class="bouquet-container">
    <!-- Saplar -->
    <div class="stem stem-1"></div>
    <div class="stem stem-2"></div>
    <div class="stem stem-3"></div>
    <div class="stem stem-4"></div>
    <div class="stem stem-5"></div>

    <!-- Çiçekler -->
    <div class="flower flower-1">
      <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
      <div class="center"></div>
    </div>

    <div class="flower flower-2">
      <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
      <div class="center"></div>
    </div>

    <div class="flower flower-3">
      <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
      <div class="center"></div>
    </div>

    <div class="flower flower-4">
      <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
      <div class="center"></div>
    </div>

    <div class="flower flower-5">
      <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
      <div class="center"></div>
    </div>

    <!-- Buket Ambalajı & Kurdele -->
    <div class="wrapper"></div>
    <div class="ribbon"></div>
  </div>

  <script>
    // Arka planda yüzen simgeler
    const icons = ['🌸', '✨', '💖', '🌷', '🤍'];
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'bg-heart';
      heart.innerText = icons[Math.floor(Math.random() * icons.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 4 + 's';
      heart.style.fontSize = Math.random() * 14 + 14 + 'px';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }
    setInterval(createHeart, 450);
  </script>
</body>
</html>
