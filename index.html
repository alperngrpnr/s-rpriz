
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  .scene{
    width:100%;
    min-height:560px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px 16px 40px;
    position:relative;
    overflow:hidden;
  }
  .particle{
    position:absolute;
    border-radius:50%;
    opacity:0;
    pointer-events:none;
    animation:pdrift var(--d) ease-in-out infinite var(--delay);
  }
  @keyframes pdrift{
    0%{transform:translateY(0) translateX(0) scale(0.5);opacity:0}
    20%{opacity:var(--op)}
    80%{opacity:var(--op)}
    100%{transform:translateY(-140px) translateX(var(--sx)) scale(1);opacity:0}
  }
  .flower-svg{
    width:min(300px,85vw);
    height:auto;
    display:block;
    animation:rise 1s cubic-bezier(0.22,1,0.36,1) forwards;
    opacity:0;
    transform:translateY(30px);
  }
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .petal-g{
    transform-origin:150px 175px;
    animation:bloom 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
    opacity:0;
  }
  @keyframes bloom{
    from{opacity:0;transform:rotate(var(--rot)) scale(0.1)}
    to{opacity:1;transform:rotate(var(--rot)) scale(1)}
  }
  .stem-g{
    animation:stemup 0.7s ease forwards;
    opacity:0;
    transform-origin:150px 270px;
  }
  @keyframes stemup{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
  .leaf-g{
    animation:leafpop 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
    opacity:0;
  }
  @keyframes leafpop{
    from{opacity:0;transform:scale(0) rotate(var(--lr))}
    to{opacity:1;transform:scale(1) rotate(var(--lr))}
  }
  .center-g{
    animation:cpop 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards;
    animation-delay:0.9s;
    opacity:0;
    transform-origin:150px 170px;
  }
  @keyframes cpop{
    from{opacity:0;transform:scale(0)}
    to{opacity:1;transform:scale(1)}
  }
  .sparkle-g{
    animation:spark var(--sd) ease both;
    opacity:0;
    transform-origin:var(--sx) var(--sy);
  }
  @keyframes spark{
    0%{opacity:0;transform:scale(0)}
    45%{opacity:1;transform:scale(1.2)}
    100%{opacity:0;transform:scale(0)}
  }
  .msg-wrap{
    margin-top:28px;
    text-align:center;
    animation:fadeup 0.9s ease forwards;
    animation-delay:1.5s;
    opacity:0;
    padding:0 8px;
  }
  @keyframes fadeup{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
  }
  .msg-main{
    font-family:'Playfair Display',Georgia,serif;
    font-size:clamp(16px,4.5vw,21px);
    font-weight:600;
    color:#5a3e2b;
    line-height:1.4;
  }
  .msg-sub{
    margin-top:8px;
    font-size:clamp(12px,3.2vw,14px);
    color:#9a7a66;
    font-style:italic;
    font-family:'Playfair Display',Georgia,serif;
    letter-spacing:0.02em;
  }
</style>

<script>
(function(){
  var scene=document.getElementById('scene');
  scene.addEventListener('click',function(e){
    var p=document.createElement('div');
    var sz=5+Math.random()*7;
    var colors=['#ffb3c1','#ffd6e0','#ffe4b5','#c8e6c9','#f9c4c4','#fad0b8'];
    var c=colors[Math.floor(Math.random()*colors.length)];
    var r=scene.getBoundingClientRect();
    p.style.cssText='position:absolute;pointer-events:none;border-radius:50%;z-index:10;width:'+sz+'px;height:'+sz+'px;background:'+c+';left:'+(e.clientX-r.left-sz/2)+'px;top:'+(e.clientY-r.top-sz/2)+'px;';
    p.style.setProperty('--d','1.1s');
    p.style.setProperty('--delay','0s');
    p.style.setProperty('--op','0.85');
    p.style.setProperty('--sx',(Math.random()*36-18)+'px');
    p.style.animation='pdrift 1.1s ease forwards';
    scene.appendChild(p);
    setTimeout(function(){p.remove()},1200);
  });
})();
</script>
